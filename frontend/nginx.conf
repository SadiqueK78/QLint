server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # QLint routes entirely in the browser: App.jsx keeps its current page in
    # window.location.pathname and moves between pages with history.pushState.
    # nginx never sees those navigations -- but it does see the first request
    # when someone opens /help, /about or /benchmark directly, or reloads the
    # page while on one. There is no file at those paths, so without this
    # fallback each of them would be a 404 and only the site root would work.
    #
    # try_files hands any path that is not a real file to index.html, which
    # boots the app, which reads the pathname and renders the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite fingerprints everything under /assets (main-a1b2c3d4.js), so those
    # files are immutable: a change produces a new name rather than new content
    # at the same name. They can therefore be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the opposite case -- it is the file that names the current
    # fingerprinted bundles, so a cached copy would keep pointing a returning
    # visitor at the previous deploy's assets.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
