name: Deploy Backend to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy QLint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend deployment package
        run: |
          cd backend
          zip -r ../qlint-backend.zip . \
            -x "*.git*" \
            -x "__pycache__/*" \
            -x ".venv/*"

      # TEMPORARY DEBUG STEP
      - name: Show GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString()
            );

            console.log('SUB:', payload.sub);
            console.log('AUD:', payload.aud);
            console.log('REPOSITORY:', payload.repository);
            console.log('REPOSITORY_ID:', payload.repository_id);
            console.log('REPOSITORY_OWNER:', payload.repository_owner);
            console.log('REPOSITORY_OWNER_ID:', payload.repository_owner_id);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: us-east-1

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.4
        with:
          aws-region: us-east-1
          application-name: qlint
          environment-name: Qlint-env
          deployment-package-path: qlint-backend.zip
