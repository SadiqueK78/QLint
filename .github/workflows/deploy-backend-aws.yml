name: Deploy Backend to AWS

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy QLint Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create backend deployment package
        run: |
          cd backend
          zip -r ../qlint-backend.zip . \
            -x "*.git*" \
            -x "__pycache__/*" \
            -x ".venv/*"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::696035274423:role/github-actions-qlint
          aws-region: us-east-1

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1.0.4
        with:
          aws-region: us-east-1
          application-name: qlint
          environment-name: Qlint-env
          deployment-package-path: qlint-backend.zip
