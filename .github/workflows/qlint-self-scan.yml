name: QLint Self-Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - id: qlint
        uses: ./.github/actions/qlint-scan
        with:
          fail-on: critical
          # The benchmark measures classical RSA-2048/ECDSA-P256 as the baseline
          # it compares PQC against — deliberate subjects, not vulnerabilities.
          exclude: backend/pqc_benchmark.py,backend/tests/test_pqc_benchmark.py

      # always(): a scan that fails the build is the case whose results are
      # most worth seeing in the Security tab, and the step above exits 1 there.
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: qlint-results.sarif
