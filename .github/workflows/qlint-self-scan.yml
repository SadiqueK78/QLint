name: QLint Self-Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - id: qlint
        uses: ./.github/actions/qlint-scan
        with:
          fail-on: critical
          # Excluded from QLint scanning itself, and why:
          #
          #   backend/pqc_benchmark.py   The benchmark measures classical
          #                              RSA-2048/ECDSA-P256 as the baseline it
          #                              compares PQC against — deliberate
          #                              subjects, not vulnerabilities.
          #
          #   backend/tests/test_*.py    Test code names crypto on purpose: it
          #                              builds vulnerable fixtures to prove the
          #                              scanners detect them, and helpers like
          #                              _rsa_finding() tokenize to "rsa" and
          #                              match as function calls. Neither ships.
          #                              Excluded as a pattern rather than file
          #                              by file, so a new detection test does
          #                              not break the build on the way in.
          #
          #   backend/tls_scanner.py     Same reason as pqc_benchmark.py, one
          #                              level further out. To report what
          #                              algorithm a site's certificate uses,
          #                              this module has to import the types it
          #                              is classifying against:
          #                              `from cryptography.hazmat.primitives
          #                              .asymmetric import dsa, ec, ed448,
          #                              ed25519, rsa`. Those names are used in
          #                              isinstance() checks on a certificate
          #                              somebody else served -- QLint generates
          #                              no keys and performs no crypto here.
          #                              The AST scanner flags names imported
          #                              from crypto packages, which is right
          #                              everywhere except in the code whose job
          #                              is naming those algorithms.
          #
          # Deliberately NOT excluded: production files that merely use SHA-256
          # non-cryptographically (e.g. explain_router.py's and
          # web_scan_router.py's cache keys). Those surface as warning/info,
          # which fail-on:critical does not fail the build over, and muting a
          # shipped file would hide a real finding in it later.
          #
          # Nothing else in the website-scanning code needs excluding:
          # header_scanner.py, js_web_scanner.py and ssrf_guard.py name no
          # algorithms, and web_scan_router.py's only finding is the SHA-256
          # cache key above.
          exclude: backend/pqc_benchmark.py,backend/tests/test_*.py,backend/tls_scanner.py

      # always(): a scan that fails the build is the case whose results are
      # most worth seeing in the Security tab, and the step above exits 1 there.
      - if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: qlint-results.sarif
